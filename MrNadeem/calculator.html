<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - JS Print Solutions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Our Services</a>
        <a href="calculator.html">Quote Calculator</a>
    </nav>

    <main>
        <h1>Instant Quote Calculator</h1>
        
        <div class="calculator-card">
            <label for="quantity">Number of Lanyards needed:</label>
            <input type="number" id="quantity" placeholder="e.g. 100" min="1">

            <label for="promoCode">Promo Code (Optional):</label>
            <input type="text" id="promoCode" placeholder="Enter code here">

            <!-- This button triggers the JavaScript function when clicked -->
            <button onclick="calculateTotal()">Calculate Price</button>

            <!-- The JavaScript will inject the text into these empty headings -->
            <h3 id="discountMessage"></h3>
            <h2 id="finalTotal">Total: £0.00</h2>
        </div>
    </main>

    <!-- Links to your JavaScript logic -->
    <script src="script.js"></script>
</body>
</html>
